[project]
name = "kmeasure"
version = "0.1.0"
description = "Measurement scripts for the Klein Lab at UChicago."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
    { name = "Klein lab", email = "kleinlabphys@gmail.com" },
    { name = "Nick Phelps", email = "nphelps@uchicago.edu" }, 
]

dependencies = [
    "numpy>=1.24.0",
    "qcodes>=0.38.0",
    "zhinst.qcodes",
    "pyqtgraph",
    "PySide6",
    "pyvisa-py"
]

[project.optional-dependencies]
dev = [
    "jupyter",
]